<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EE">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="יאללה מדברים">
<title>יאללה מדברים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EE; --paper:#FFFDF9; --ink:#2B2420; --muted:#8A7F76; --line:#EADFD0;
  --terra:#C8553D; --terra-d:#A8432E; --teal:#1F6F6B; --teal-l:#E3F0EE; --sun:#E9A23B; --sun-l:#FCEFD6;
  --sky:#3B6FB6; --sky-l:#E4ECF7; --red:#C0392B; --green:#2E8B57;
  --r:18px; --shadow:0 1px 2px rgba(43,36,32,.06),0 6px 20px rgba(43,36,32,.07);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;font-size:16px;line-height:1.5}
.es{font-family:Lora,Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:calc(10px + var(--safe-t)) 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{font-family:Lora,serif;font-weight:600;font-size:18px;letter-spacing:.2px}
.brand span{color:var(--terra)}
#hdr-level{font-size:13px;background:var(--paper);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
#main{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + var(--safe-b))}
body.immersive header,body.immersive #nav{display:none}
body.immersive #main{padding-top:calc(12px + var(--safe-t))}
#nav{position:fixed;bottom:0;inset-inline:0;z-index:6;display:flex;justify-content:space-around;background:var(--paper);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
#nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;color:var(--muted);border-radius:12px}
#nav button i{font-style:normal;font-size:21px;line-height:1}
#nav button.on{color:var(--terra);font-weight:500}
#nav button.on i{transform:translateY(-1px)}
.h{font-size:24px;margin:4px 0 14px}
.h3{font-size:17px;margin:24px 0 10px}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.3px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 16px;font-weight:500;margin-top:10px;text-align:center;text-decoration:none;min-height:46px}
.btn.big{padding:16px;font-size:17px}
.btn.small{padding:8px 12px;font-size:14px;min-height:38px;width:auto;display:inline-block;margin:4px}
.btn.primary{background:var(--terra);color:#fff;box-shadow:0 4px 14px rgba(200,85,61,.28)}
.btn.primary:active{background:var(--terra-d)}
.btn.primary:disabled{background:#D9CFC4;box-shadow:none;color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.icon{background:var(--paper);border:1px solid var(--line);width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center;font-size:18px;flex:none}
.icon.big{width:54px;height:54px;font-size:22px;background:var(--teal);color:#fff;border:0}
.icon.inline{width:30px;height:30px;font-size:14px;vertical-align:middle}
section{animation:rise .25s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* welcome */
.hero{padding:28px 6px 10px}
.hero-badge{display:inline-block;background:var(--sun-l);color:#8a5a10;padding:5px 12px;border-radius:99px;font-family:Lora,serif;font-style:italic}
.hero h1{font-family:Lora,serif;font-size:34px;line-height:1.15;margin:14px 0 8px}
.how{list-style:none;padding:0;margin:20px 0}
.how li{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
/* home */
.today{background:var(--paper);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.today-top{display:flex;justify-content:space-between;align-items:flex-start}
.today-title{font-size:20px;font-weight:700}
.streak{background:var(--sun-l);border-radius:99px;padding:5px 12px;font-weight:700}
.stats3,.card-sum,.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.card-sum{grid-template-columns:1fr 1fr}
.grid4{grid-template-columns:1fr 1fr}
.stats3>div,.card-sum>div,.grid4>div{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.grid4>div{background:var(--paper);box-shadow:var(--shadow)}
.stats3 b,.card-sum b,.grid4 b{display:block;font-size:24px;line-height:1.2}
.stats3 span,.card-sum span,.grid4 span{font-size:12px;color:var(--muted)}
.next-story{margin-top:14px;background:var(--teal);color:#fff;border-radius:var(--r);padding:18px;cursor:pointer}
.next-story .eyebrow,.next-story .muted{color:#cfe6e3}
.ns-row{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.ns-title{font-size:22px;font-weight:600}
.ns-go{font-size:30px}
.banner{margin-top:14px;background:var(--sun-l);border-radius:var(--r);padding:16px}
.banner p{margin:4px 0 0}
.tip{margin-top:14px;font-size:14px;color:var(--muted);padding:0 4px}
/* cards hub */
.modes{display:grid;gap:8px}
.mode{display:flex;gap:12px;align-items:center;text-align:start;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.mode .mi{font-size:22px}
.mode small{display:block;color:var(--muted)}
.mode.on{border-color:var(--terra);background:#FFF5F1}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center;font-size:14px}
.track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px}
.fill.known{background:var(--teal)} .fill.stable{background:var(--green)} .fill.learning{background:var(--sun)} .fill.new{background:var(--sky)}
.wl{margin-top:10px;background:var(--paper);border-radius:14px;overflow:hidden}
.wl-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.tag{font-size:11px;padding:2px 8px;border-radius:99px}
.tag.new{background:var(--sky-l);color:var(--sky)} .tag.learning{background:var(--sun-l);color:#8a5a10} .tag.stable{background:#E2F2E8;color:var(--green)} .tag.known{background:var(--teal-l);color:var(--teal)}
/* session */
.ses-top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog div{height:100%;background:var(--terra);border-radius:99px;transition:width .3s}
.flash{position:relative;background:var(--paper);border-radius:22px;box-shadow:var(--shadow);min-height:46vh;padding:34px 20px 22px;display:flex;flex-direction:column;justify-content:center;text-align:center;animation:rise .2s ease}
.flash.is-new{border-top:5px solid var(--sky)}
.newtag{position:absolute;top:12px;inset-inline-start:14px;font-size:12px;background:var(--sky-l);color:var(--sky);padding:2px 10px;border-radius:99px}
.f-word{font-size:38px;font-weight:600;line-height:1.2;margin-bottom:14px;word-break:break-word}
.f-word.en{font-family:Rubik,sans-serif;font-size:30px}
.spk{margin:0 auto}
.divider{height:1px;background:var(--line);margin:18px 0}
.b-word{font-size:24px;font-weight:500}
.b-word.en{font-family:Rubik,sans-serif}
.ctx{margin:16px 0 8px;font-size:18px;line-height:1.6;background:var(--bg);border-radius:12px;padding:12px;text-align:left}
mark{background:var(--sun-l);color:inherit;padding:0 3px;border-radius:4px;font-weight:600}
.ctx-en{text-align:left;font-size:14px;color:var(--muted);margin-bottom:8px}
.ctx-en summary{text-align:right;cursor:pointer}
.ses-actions{margin-top:14px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grade{border:0;border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;color:#fff}
.grade b{font-size:15px}
.grade small{font-size:11px;opacity:.9}
.g1{background:var(--red)} .g2{background:#D9822B} .g3{background:var(--green)} .g4{background:var(--sky)}
.done{text-align:center;padding:40px 10px}
.done-emoji{font-size:56px}
.done h2{font-family:Lora,serif;font-size:30px;margin:8px 0}
/* stories */
.gen{background:var(--paper);border:1.5px dashed var(--sun);border-radius:var(--r);padding:14px}
.gen-head{display:flex;flex-direction:column;gap:2px}
.gen-row{display:flex;gap:8px;margin-top:10px}
.gen-row input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);min-width:0}
.gen-row .btn{width:auto;margin:0;padding:10px 18px}
.slist{display:grid;gap:8px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.srow.read{background:#F7FBF9;border-color:#CFE3DA}
.sr-title{font-size:18px;font-weight:600}
.sr-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.score{color:var(--green);font-weight:700;font-size:14px}
.ai{font-family:Rubik;font-size:10px;background:var(--sun-l);color:#8a5a10;padding:1px 6px;border-radius:99px;vertical-align:middle}
/* reader */
.r-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.r-title{font-size:26px;margin:2px 0 0;line-height:1.2}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin:10px 0 6px;color:var(--ink)}
.lg{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:4px}
.lg.tgt{background:var(--sky)} .lg.lrn{background:var(--sun)}
.story{background:var(--paper);border-radius:var(--r);padding:18px 18px 8px;box-shadow:var(--shadow);margin-top:8px}
.para{position:relative;margin-bottom:14px}
.para p{font-size:19.5px;line-height:1.8;margin:0;text-align:left}
.w{border-radius:4px;padding:1px 0;cursor:pointer}
.w.tgt{border-bottom:2.5px solid var(--sky)}
.w.lrn{border-bottom:2.5px solid var(--sun)}
.w.sel{background:var(--terra);color:#fff;border-bottom-color:transparent}
.sent{transition:background .2s}
.sent.cur{background:var(--teal-l);border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tr-btn{display:block;margin:6px 0 0 auto;margin-inline-start:0;background:none;border:1px solid var(--line);border-radius:99px;font-size:11px;padding:2px 10px;color:var(--muted)}
.tr-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tr{font-size:15px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:6px;line-height:1.55;text-align:left}
.quiz{margin-top:8px}
.q{background:var(--paper);border-radius:14px;padding:14px;margin-bottom:10px}
.q-t{font-weight:600;font-size:17px;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;margin-top:7px;font-size:16px;min-height:46px}
.opt.right{background:#E2F2E8;border-color:var(--green)}
.opt.wrong{background:#FBE5E1;border-color:var(--red)}
.opt.nose{text-align:center;color:var(--muted);background:transparent;border-style:dashed;font-family:Rubik}
.res{background:var(--paper);border-radius:var(--r);padding:18px;text-align:center;box-shadow:var(--shadow)}
.res-score{font-size:40px;font-weight:700;color:var(--teal)}
.player{position:fixed;bottom:calc(64px + var(--safe-b));inset-inline:0;margin:0 auto;max-width:420px;width:calc(100% - 24px);background:var(--ink);color:#fff;border-radius:99px;padding:7px 9px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:4;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.player .icon:not(.big){background:transparent;color:#fff;border-color:#5a4f48}
.rates{display:flex;gap:4px}
.rate{background:transparent;border:1px solid #5a4f48;color:#ddd;border-radius:99px;padding:6px 10px;font-size:13px}
.rate.on{background:#fff;color:var(--ink);border-color:#fff}
/* word sheet */
#scrim{position:fixed;inset:0;background:rgba(43,36,32,.18);opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;inset-inline:0;bottom:0;z-index:9;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.15);padding:8px 18px calc(18px + var(--safe-b));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
#sheet.on{transform:none}
.grip{width:40px;height:5px;background:var(--line);border-radius:99px;margin:4px auto 12px}
.ws-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ws-word{font-size:30px;font-weight:600;line-height:1.1}
.ws-top .spk{margin:0}
.ws-gloss{font-size:20px;margin:10px 0 4px;text-align:left}
.ws-ai{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.ws-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ws-acts .btn{margin:0}
.indeck{display:grid;place-items:center;background:var(--teal-l);color:var(--teal);border-radius:14px;font-size:14px;font-weight:500;padding:8px;text-align:center}
/* placement */
.pt{padding-top:10px}
.pt-s{font-size:24px;line-height:1.5;margin:14px 0 18px;background:var(--paper);padding:20px;border-radius:var(--r);box-shadow:var(--shadow);text-align:left}
.pt-pass{font-size:18px;line-height:1.65;background:var(--paper);padding:16px;border-radius:var(--r);margin:12px 0;box-shadow:var(--shadow);text-align:left}
.pt-q{font-weight:600;font-size:18px;margin-bottom:6px;text-align:left}
.pt-res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.pt-res div{background:var(--paper);border-radius:12px;padding:10px}
.pt-res span{display:block;font-size:12px;color:var(--muted)}
/* progress */
.lvl-card{display:flex;gap:14px;align-items:center;background:var(--paper);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.lvl-icon{font-size:42px}
.lvl-name{font-size:22px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:12px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 4px;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
.settings{background:var(--paper);border-radius:var(--r);padding:4px 14px;box-shadow:var(--shadow)}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);min-height:52px}
.set:last-of-type{border-bottom:0}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px}
.tgl{width:50px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;transition:background .2s}
.tgl i{position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:inset-inline-start .2s}
.tgl.on{background:var(--teal)}
.tgl.on i{inset-inline-start:23px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px;font:12px monospace;margin-bottom:10px;background:var(--bg)}
#toast{position:fixed;top:calc(14px + var(--safe-t));left:50%;transform:translate(-50%,-80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:20;transition:transform .25s;pointer-events:none;white-space:nowrap}
#toast.on{transform:translate(-50%,0)}

/* v2: practice days, card context, verbs */
.streak small{font-weight:400;font-size:12px;color:#8a5a10}
.ctx-wrap{margin:14px 0 8px}
.ctx-wrap .ctx{margin:0}
.ctx .w{cursor:pointer;border-radius:4px}
.ctx .w.hit{background:var(--sun-l);font-weight:600;padding:0 3px}
.ctx .w.sel{background:var(--terra);color:#fff}
.en-ctx{font-family:Rubik,sans-serif;font-size:16px;color:var(--ink)}
.ctx-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;justify-content:center}
.pill{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;min-height:34px}
.cj-drill{background:var(--paper);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 12px;font-size:14px;display:flex;gap:6px;align-items:center}
.chip small{font-size:11px;color:var(--muted)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.on small{color:#cfe6e3}
.seg.two{grid-template-columns:repeat(3,1fr);margin-top:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.tab{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;font-size:14px}
.tab small{font-size:11px;color:var(--muted)}
.tab.on{border-color:var(--terra);background:#FFF5F1}
.tense-card{background:var(--paper);border-radius:var(--r);padding:16px;margin-top:10px;box-shadow:var(--shadow)}
.tense-card p{margin:8px 0;font-size:15px}
.tc-head{display:flex;justify-content:space-between;align-items:center}
.tc-name{font-size:22px;font-weight:600}
.tc-form{background:var(--bg);border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.7;text-align:left}
.tc-ex{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:17px;margin-top:10px;text-align:left}
.verb-pick{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 8px;padding:0 16px 6px;scrollbar-width:none}
.vchip{flex:none;font-family:Lora,serif;border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 12px;font-size:15px}
.vchip.irr{border-style:dashed}
.vchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.conj-table{background:var(--paper);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.ct-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.ct-row{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;text-align:left;column-gap:10px}
.ct-p{color:var(--muted);font-size:15px}
.ct-f{font-size:19px;font-weight:600;color:var(--teal);text-align:right}
.ct-he{grid-column:1/3;font-size:11px;color:var(--muted);text-align:left}
.cjq{padding-top:6px}
.cj-meta{display:flex;gap:8px;align-items:center}
.cj-verb{font-size:26px;font-weight:600;margin:14px 0 4px;text-align:left}
.cj-sent{font-size:22px;line-height:1.6;background:var(--paper);padding:18px;border-radius:var(--r);box-shadow:var(--shadow);margin:10px 0 6px;text-align:left}
.blank{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--terra);color:var(--terra);font-weight:600;text-align:center}
.blank.ok{color:var(--green);border-color:var(--green)} .blank.bad{color:var(--red);border-color:var(--red)}

/* ============ state ============ */
function defaultState() {

}
function normalize(s) {
  const d = defaultState();

  const o = Object.assign(d, s);
  o.settings = Object.assign(defaultState().settings, s.settings || {});
  for (const k of ["cards", "known", "read", "lookups", "days"]) if (!o[k] || typeof o[k] !== "object") o[k] = {};

}

/* ============ card definitions ============ */
let DEFS = {}, STORY_FORM = {}, STORY_TGT = {}, GLOBAL_FORM = {}, TRI_IDS = [];
const has = (line, k) => (" " + nk(line.tr) + " ").includes(" " + k + " ");
function buildDefs() {
  DEFS = {}; STORY_FORM = {}; STORY_TGT = {}; GLOBAL_FORM = {}; TRI_IDS = [];
  const sts = STORIES.slice().sort((a, b) => a.level - b.level);
  sts.forEach(st => { STORY_FORM[st.id] = {}; STORY_TGT[st.id] = []; });
  UNITS.forEach((u, ui) => u.list.forEach(it => {
    const k = nk(it.tr); if (!k) return;
    const id = "c_" + k.replace(/\s+/g, "_");
    if (DEFS[id]) return;
    const d = { id, k, tr: it.tr, ar: it.ar, he: it.he, note: it.note, big: it.big, unit: ui, level: unitLv(ui), storyId: null, sent: null, dlgUnit: null };
    for (const st of sts) {
      const ln = st.lines.find(l => has(l, k));
      if (!ln) continue;
      if (!d.sent) { d.sent = ln; d.storyId = st.id; }
      STORY_TGT[st.id].push(id);
      if (!k.includes(" ")) STORY_FORM[st.id][k] = id;
    }
    if (!d.sent) {
      const order = [ui].concat(UNITS.map((_, i) => i).filter(i => i !== ui));
      for (const j of order) { const ln = UNITS[j].dlg.find(l => has(l, k)); if (ln) { d.sent = ln; d.dlgUnit = j; break; } }
    }
    if (!k.includes(" ") && !GLOBAL_FORM[k]) GLOBAL_FORM[k] = id;
    DEFS[id] = d;
    if (ui === 11 || ui === 0) TRI_IDS.push(id);
  }));
}
function getDef(id) { return DEFS[id] || (S.cards[id] && S.cards[id].def) || null; }
function cardStatus(id) {
  if (S.known[id]) return "known";
  const c = S.cards[id];
  if (!c || c.st === "new") return "new";
  if (c.st === "learning" || (c.s || 0) < 7) return "learning";
  return "stable";
}
function isNewCard(id) { return !S.known[id] && (!S.cards[id] || S.cards[id].st === "new"); }
function storyById(id) { return STORIES.find(s => s.id === id); }
function nextStory() {
  const lst = STORIES.filter(s => s.level === S.level && !S.read[s.id]);
  if (lst.length) return lst[0];
  return STORIES.find(s => !S.read[s.id] && s.level <= S.level) || null;
}
function newQueue(limitStoryId, unitIdx) {
  const out = [], seen = new Set();
  const push = id => { if (id && !seen.has(id) && getDef(id) && isNewCard(id)) { seen.add(id); out.push(id); } };
  if (limitStoryId) { (STORY_TGT[limitStoryId] || []).forEach(push); return out; }
  if (unitIdx != null) { Object.values(DEFS).filter(d => d.unit === unitIdx).forEach(d => push(d.id)); return out; }
  Object.keys(S.cards).filter(id => S.cards[id].st === "new").sort((a, b) => (S.cards[a].added || 0) - (S.cards[b].added || 0)).forEach(push);
  const storyIds = [];
  for (const st of STORIES) if (S.read[st.id]) storyIds.push(...STORY_TGT[st.id]);
  const nx = nextStory(); if (nx) storyIds.push(...STORY_TGT[nx.id]);
  const sl = TRI_IDS.filter(isNewCard);
  let a = 0, b = 0;
  const su = [...new Set(storyIds)].filter(id => !seen.has(id) && isNewCard(id));
  while (a < su.length || b < sl.length) { if (a < su.length) push(su[a++]); if (a < su.length) push(su[a++]); if (b < sl.length) push(sl[b++]); }
  Object.values(DEFS).filter(d => d.level <= S.level).forEach(d => push(d.id));
  return out;
}
function dueList(storyId, unitIdx) {
  const now = Date.now(), eod = endOfDay(now);
  return Object.keys(S.cards).filter(id => {
    const c = S.cards[id];
    if (!c || c.st === "new" || S.known[id] || !getDef(id)) return false;
    if (storyId && getDef(id).storyId !== storyId) return false;
    if (unitIdx != null && getDef(id).unit !== unitIdx) return false;

}

  }

/* ============ placement ============ */
let PT = null;
function placementBank() {
  const bank = [];
  const defs = Object.values(DEFS).filter(d => !d.big);
  for (const d of defs) {
    const others = shuffle(defs.filter(x => x.level === d.level && x.he !== d.he)).slice(0, 2).map(x => x.he);
    const opts = shuffle([d.he, ...others]);
    bank.push({ band: d.level, w: d.id, word: d.tr, ar: d.ar, opts, a: opts.indexOf(d.he) });
  }
  for (const st of STORIES) for (const l of st.lines) {
    const others = shuffle(STORIES.filter(s => s.level === st.level).flatMap(s => s.lines).filter(x => x !== l)).slice(0, 2).map(x => x.he);
    const opts = shuffle([l.he, ...others]);
    bank.push({ band: st.level, r: true, line: l, opts, a: opts.indexOf(l.he) });
  }
  return bank;
}
function renderPlacement() {
  if (!PT) PT = { band: 2, streak: 0, asked: new Set(), res: { 1: { c: 0, n: 0 }, 2: { c: 0, n: 0 }, 3: { c: 0, n: 0 } }, n: 0, max: 15, knownW: [], bank: placementBank() };
  if (PT.n >= PT.max) return finishPlacement();
  const B = PT.bank;
  const pool = B.map((x, i) => ({ x, i })).filter(o => o.x.band === PT.band && !PT.asked.has(o.i));
  const pool2 = pool.length ? pool : B.map((x, i) => ({ x, i })).filter(o => !PT.asked.has(o.i));
  if (!pool2.length) return finishPlacement();
  const wantReading = PT.n % 4 === 3;
  const cand = shuffle(pool2);
  const pick = cand.find(o => !!o.x.r === wantReading) || cand[0];
  PT.asked.add(pick.i);
  const it = pick.x, say = it.r ? it.line.ar : it.ar;
  main().innerHTML = `
  <div class="ses-top"><button class="icon" id="pt-x">✕</button><div class="prog"><div style="width:${Math.round(PT.n / PT.max * 100)}%"></div></div><span class="muted small">${PT.n + 1}/${PT.max}</span></div>
  <section class="pt">
    <div class="eyebrow">${it.r ? "מה פירוש המשפט?" : "מה פירוש המילה?"}</div>
    <div class="${it.r ? "pt-pass" : "pt-s"}">${esc(it.r ? it.line.tr : it.word)}${arLine(it.r ? it.line.ar : it.ar)}<button class="icon spk" id="pt-say" aria-label="הקרא">🔊</button></div>
    <div class="pt-opts">${it.opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}
    <button class="opt nose" data-k="-1">מא בערף · לא יודע</button></div>
  </section>`;
  $("#pt-say").onclick = () => speak(say, 0.9);
  setTimeout(() => speak(say, 0.9), 200);
  $("#pt-x").onclick = () => { PT = null; go(S.placement.done ? "progress" : "welcome"); };
  document.querySelectorAll(".pt-opts .opt").forEach(b => b.onclick = () => {
    const ok = +b.dataset.k === it.a;
    const r = PT.res[it.band]; r.n++; if (ok) r.c++;
    if (ok && it.w) PT.knownW.push(it.w);
    if (ok) { PT.streak++; if (PT.streak >= 2 && PT.band < 3) { PT.band++; PT.streak = 0; } }
    else { PT.streak = 0; if (PT.band > 1) PT.band--; }
    PT.n++; renderPlacement();
  });
}
function finishPlacement() {
  const res = PT.res;
  let lvl = 1;
  for (const b of [3, 2]) { const r = res[b]; if (r.n >= 2 && r.c / r.n >= 0.7) { lvl = b; break; } }
  if (lvl === 1 && res[2].n >= 3 && res[2].c / res[2].n >= 0.6 && res[1].n && res[1].c / res[1].n >= 0.8) lvl = 2;
  S.level = lvl;
  S.placement = { done: true, date: Date.now(), res };
  for (const id of PT.knownW) if (DEFS[id] && DEFS[id].level < lvl) S.known[id] = true;
  bumpStreak(); save(); PT = null;
  const L = LV[lvl];
  $("#hdr-level").textContent = L.icon + " " + L.he;
  main().innerHTML = `<section class="done">
    <div class="done-emoji">${L.icon}</div>
    <div class="eyebrow">הרמה שלך</div>
    <h2>${L.he} · ${L.ar}</h2>
    <p>${L.desc}</p>
    <div class="pt-res">${[1, 2, 3].map(b => `<div><span>${LV[b].he}</span><b>${res[b].n ? Math.round(res[b].c / res[b].n * 100) + "%" : "—"}</b></div>`).join("")}</div>
    <p class="muted small">אפשר לשנות רמה ידנית או לעשות את המבחן שוב במסך "התקדמות". האפליקציה תציע לעלות רמה כשתהיה מוכן.</p>
    <button class="btn primary big" id="pt-go">יאללה, לסיפור הראשון 📖</button>
  </section>`;
  $("#pt-go").onclick = () => { const nx = nextStory(); nx ? go("reader", nx.id) : go("home"); };
}

/* ============ progress & settings ============ */
function renderProgress() {
  const counts = { new: 0, learning: 0, stable: 0, known: 0 };
  for (const id of allIds()) counts[cardStatus(id)]++;
  const reads = Object.values(S.read);
  const avg = reads.length ? Math.round(reads.reduce((a, r) => a + r.score, 0) / reads.length * 100) : null;
  const L = LV[S.level], st = S.settings;
  main().innerHTML = `
  <h2 class="h">התקדמות</h2>
  <section class="lvl-card">
    <div class="lvl-icon">${L.icon}</div>
    <div><div class="eyebrow">רמה נוכחית</div><div class="lvl-name">${L.he} · ${L.ar}</div><div class="muted small">${L.desc}</div></div>
  </section>
  <div class="seg">${[1, 2, 3].map(l => `<button class="${S.level === l ? "on" : ""}" data-l="${l}">${LV[l].icon} ${LV[l].he}</button>`).join("")}</div>
  <button class="btn ghost" id="pg-test">🧪 מבחן רמה מחדש</button>
  <section class="grid4">
    <div><b>${counts.stable + counts.known}</b><span>מילים שנקלטו</span></div>
    <div><b>${counts.learning}</b><span>בלמידה</span></div>
    <div><b>${reads.length}</b><span>סיפורים שנקראו</span></div>
    <div><b>🔥 ${practiceDays()}</b><span>ימי תרגול</span></div>
  </section>
  <h3 class="h3">הגדרות</h3>
  <section class="settings">
    <div class="set"><span>מילים חדשות ביום</span><div class="stepper"><button id="np-m">−</button><b>${st.newPerDay}</b><button id="np-p">+</button></div></div>
    ${toggle("script", "להציג כתב ערבי", st.script)}
    ${toggle("autoplay", "הקראה אוטומטית בכרטיסיות", st.autoplay)}
    ${toggle("highlight", "סימון מילים חדשות/בלמידה בסיפור", st.highlight)}
    ${toggle("reverseMature", "לפעמים להפוך כרטיס בשל (עברית ← ערבית)", st.reverseMature)}
    <div class="set"><span>מקור הקול</span><select id="pg-src">${[["auto", "אוטומטי"], ["device", "קול המכשיר"], ["online", "קול אונליין"]].map(([v, n]) => `<option value="${v}" ${st.voiceSrc === v ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    <div class="set"><span>קול הקראה</span><span class="muted small">${esc(voiceLabel())}</span></div>
    <div class="set"><button class="btn ghost small" id="pg-voice">🔊 בדיקת קול</button></div>
  </section>
  <h3 class="h3">גיבוי</h3>
  <section class="settings">
    <div class="set"><span>שמירה</span><span class="muted small">📱 בטלפון הזה בלבד</span></div>
    <div class="set"><button class="btn ghost small" id="pg-copy">העתק גיבוי</button><button class="btn ghost small" id="pg-restore">שחזר מגיבוי</button></div>
    <textarea id="pg-ta" hidden placeholder="הדבק כאן את הגיבוי ולחץ שוב על שחזר" dir="ltr"></textarea>
  </section>
  <p class="muted small center">יאללה מדברים · ערבית מדוברת (המשולש) · FSRS-4.5 · ${STORIES.length} סיפורים · ${Object.keys(DEFS).length} מילים</p>`;
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { S.level = +b.dataset.l; save(); go("progress"); });
  $("#pg-test").onclick = () => { PT = null; go("placement"); };
  $("#np-m").onclick = () => { st.newPerDay = Math.max(3, st.newPerDay - 1); save(); renderProgress(); };
  $("#np-p").onclick = () => { st.newPerDay = Math.min(20, st.newPerDay + 1); save(); renderProgress(); };
  document.querySelectorAll(".tgl").forEach(b => b.onclick = () => { st[b.dataset.k] = !st[b.dataset.k]; save(); renderProgress(); });
  $("#pg-src").onchange = e => { st.voiceSrc = e.target.value; save(); renderProgress(); };
  $("#pg-voice").onclick = () => speak("مرحبا، كيفك؟ يعطيك العافية", st.rate);
  $("#pg-copy").onclick = async () => {
    const data = JSON.stringify({ state: S });
    try { await navigator.clipboard.writeText(data); toast("הגיבוי הועתק"); }
    catch (e) { const ta = $("#pg-ta"); ta.hidden = false; ta.value = data; ta.select(); toast("העתק את הטקסט ידנית"); }
  };
  $("#pg-restore").onclick = () => {
    const ta = $("#pg-ta");
    if (ta.hidden || !ta.value.trim()) { ta.hidden = false; ta.value = ""; ta.focus(); return; }
    try { const j = JSON.parse(ta.value); S = normalize(j.state || j); save(); toast("שוחזר ✓"); go("home"); } catch (e) { toast("הגיבוי לא תקין"); }
  };
}
function toggle(k, label, on) { return `<div class="set"><span>${label}</span><button class="tgl ${on ? "on" : ""}" data-k="${k}" role="switch" aria-checked="${on}"><i></i></button></div>`; }

/* ============ boot ============ */
function boot() {
  S = normalize(lsGet("ym_state"));
  buildDefs(); rolloverDay();
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => go(b.dataset.v));
  $("#scrim").onclick = closeSheet;
  go(S.placement.done ? "home" : "welcome");
}
document.addEventListener("DOMContentLoaded", boot);

</script>
</body>
</html>
