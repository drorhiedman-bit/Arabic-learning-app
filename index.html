<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2F6B4F">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="יאללה מדברים">
<title>יאללה מדברים — ערבית מדוברת</title>
<style>
:root{--bg:#FAF6EE;--ink:#1F2A24;--muted:#5D6B62;--olive:#2F6B4F;--olive2:#E3EFE7;--sand:#F1E7D3;--accent:#C9771F;--ok:#1E7A46;--okbg:#DFF3E6;--bad:#B3261E;--badbg:#FBE3E1;--line:#E2D9C6;--sh:0 1px 4px rgba(0,0,0,.07)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding-bottom:78px}
.ar{font-family:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic","Arial",serif;direction:rtl}
#app{max-width:560px;margin:0 auto;padding:12px 14px}
h2{font-size:21px;margin:.3em 0}
.top{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.top h1{font-size:21px;margin:0;flex:1;color:var(--olive)}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:0;border-radius:99px;padding:4px 12px;font:inherit;font-size:16px;font-weight:800;box-shadow:var(--sh);min-height:40px;cursor:pointer;color:inherit}
.chip.static{cursor:default}
.off{filter:grayscale(1);opacity:.55}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:16px;font:inherit;font-weight:700;cursor:pointer;padding:10px 16px;margin:8px 0}
.primary{background:var(--olive);color:#fff}
.accent{background:var(--accent);color:#fff}
.secondary{background:var(--olive2);color:var(--olive)}
.ghost{background:transparent;color:var(--muted);text-decoration:underline;min-height:46px}
.back{background:none;border:0;font:inherit;color:var(--olive);font-weight:700;min-height:46px;cursor:pointer;padding:0}
.hint{color:var(--muted);text-align:center;margin:4px 0;font-size:16px}
.today{background:linear-gradient(160deg,#2F6B4F,#3E8462);color:#fff;border-radius:22px;padding:16px}
.today small{opacity:.9;font-size:15px}
.today .tt{font-size:23px;font-weight:800;margin:2px 0}
.today p{margin:.2em 0 .4em;font-size:16px;opacity:.95}
.today .btn.primary{background:#fff;color:var(--olive);margin-bottom:0}
.today .btn.soft{background:rgba(255,255,255,.18);color:#fff;margin-bottom:0}
.today .btn.ghost{color:#fff;margin:2px 0 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.tile{background:#fff;border:0;border-radius:18px;padding:10px 4px;font:inherit;font-weight:800;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;min-height:86px;color:inherit;justify-content:center}
.tile span{font-size:28px;line-height:1.2}.tile small{font-weight:400;color:var(--muted);font-size:13px}
details.lv{background:#fff;border-radius:18px;margin:8px 0;box-shadow:var(--sh);overflow:hidden}
details.lv summary{list-style:none;padding:12px 14px;font-weight:800;display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:52px}
details.lv summary::-webkit-details-marker{display:none}
details.lv summary small{color:var(--muted);font-weight:600}
.urow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-top:1px solid #F0EADF;padding:8px 14px;font:inherit;text-align:right;cursor:pointer;color:inherit;min-height:54px}
.urow .em{font-size:22px;width:32px;text-align:center}
.urow b{flex:1;font-weight:600}
.urow .st{font-size:14px;color:var(--ok);font-weight:700}
.urow.nx{background:#FFF6EA}.urow.nx .st{color:#8A4B0C}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1F2A24;color:#fff;padding:10px 18px;border-radius:14px;z-index:30;font-size:16px;max-width:92%;text-align:center;animation:fade .2s}
#nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:2px 4px calc(2px + env(safe-area-inset-bottom));z-index:5}
#nav button{flex:1;background:none;border:0;font:inherit;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;min-height:58px;cursor:pointer;justify-content:center}
#nav button span{font-size:22px;line-height:1.2}
#nav button.on{color:var(--olive);font-weight:800}
body.inlesson #nav{display:none}
body.inlesson{padding-bottom:200px}
.lbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.x{width:46px;height:46px;border-radius:50%;border:0;background:#EFE8DA;font-size:19px;cursor:pointer;flex:none}
.prog{flex:1;height:12px;background:#E9E1D1;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--olive);border-radius:99px;transition:width .3s}
.card{background:#fff;border-radius:22px;padding:18px 16px;box-shadow:0 2px 10px rgba(0,0,0,.06);text-align:center}
.tag{display:inline-block;background:var(--sand);border-radius:99px;padding:2px 12px;font-size:14px;color:#7A5A2A;font-weight:700}
.big{font-size:76px;line-height:1.2;color:var(--olive)}
.tr{font-size:34px;font-weight:800;margin:6px 0 0;line-height:1.3}
.arw{font-size:28px;color:var(--muted)}
.he{font-size:21px;margin-top:4px}
.note{background:#F6F1E6;border-radius:12px;padding:8px 12px;margin-top:12px;font-size:16px;text-align:right}
.row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.pill{min-height:48px;min-width:110px;border-radius:99px;border:2px solid var(--olive);background:#fff;color:var(--olive);font:inherit;font-weight:700;padding:6px 16px;cursor:pointer}
.q{text-align:center;margin:2px 0 10px;font-size:19px;color:var(--muted)}
.prompt{font-size:29px;font-weight:800;text-align:center;margin:6px 0;line-height:1.3}
.center{display:flex;flex-direction:column;align-items:center;gap:8px;margin:4px 0 14px}
.bigplay{width:100px;height:100px;border-radius:50%;border:0;background:var(--olive);color:#fff;font-size:42px;cursor:pointer;box-shadow:0 6px 16px rgba(47,107,79,.3)}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{min-height:58px;border-radius:16px;border:2px solid var(--line);background:#fff;font:inherit;font-size:20px;font-weight:700;cursor:pointer;padding:8px;color:inherit}
.opt small{display:block;font-size:18px;color:var(--muted);font-weight:400}
.opt.good{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.badx{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt.picked{border-color:var(--olive);background:var(--olive2)}
.opt.idk{color:var(--muted);font-weight:400;font-size:17px;border-style:dashed;min-height:50px}
.fb{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:9;box-shadow:0 -4px 16px rgba(0,0,0,.12);animation:up .2s}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb .in{max-width:560px;margin:0 auto}
.fb h3{margin:0;font-size:21px}.fb.ok h3{color:var(--ok)}.fb.bad h3{color:var(--bad)}
.fb p{margin:0 0 4px;font-size:19px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:10px;align-content:start}
.mt{min-height:62px;border-radius:16px;border:2px solid var(--line);background:#fff;font:inherit;font-size:19px;font-weight:700;cursor:pointer;padding:8px;color:inherit}
.mt.sel{border-color:var(--accent);background:#FFF4E5}
.mt.done{opacity:.35;background:var(--okbg);border-color:var(--ok);pointer-events:none}
.mt.wrong{animation:shake .35s;border-color:var(--bad)}
.mic{width:110px;height:110px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:46px;cursor:pointer}
.mic.on{animation:pulse 1s infinite}
.res{text-align:center;font-size:18px;min-height:26px;margin-top:6px}
.ctl{display:flex;gap:8px;overflow-x:auto;margin:6px 0}
.ctl .pill{min-width:auto;flex:none;font-size:16px;min-height:44px;padding:4px 14px}
.lines{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bub{max-width:90%;padding:10px 14px 10px 44px;border-radius:18px;position:relative;cursor:pointer;background:#fff;box-shadow:var(--sh);text-align:right}
.bub.a{align-self:flex-start;background:var(--olive2);border-top-right-radius:4px}
.bub.b{align-self:flex-end;border-top-left-radius:4px}
.bub.n{align-self:stretch;max-width:100%}
.bub.playing{outline:3px solid var(--accent)}
.who{font-size:13px;color:var(--muted);font-weight:700}
.btr{font-size:21px;font-weight:700;line-height:1.35}
.bar{font-size:19px;color:var(--muted)}
.bhe{font-size:16px;margin-top:2px;color:#33493d}.bhe.hid{display:none}
.eye{position:absolute;top:2px;left:2px;background:none;border:0;font-size:19px;cursor:pointer;min-width:42px;min-height:42px}
.tip{background:#FFF8EC;border:2px solid #F3D7A8;border-radius:18px;padding:12px 14px;margin:10px 0;text-align:right}
.tip b{color:#8A4B0C}.tip p{margin:.2em 0 0;font-size:17px}
.search{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);padding:8px 14px;font:inherit;background:#fff}
.wrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 12px;margin:6px 0;width:100%;border:0;font:inherit;text-align:right;cursor:pointer;color:inherit;box-shadow:var(--sh);min-height:56px}
.wrow .w{flex:1;min-width:0}.wrow b{font-size:19px}
.wrow .ar{color:var(--muted);font-size:18px;margin-inline-start:8px}
.wrow small{display:block;color:var(--muted);font-size:15px}
.wrow .lt{font-size:13px;background:var(--sand);color:#7A5A2A;border-radius:99px;padding:2px 9px;font-weight:700;white-space:nowrap}
.wrow.rec{outline:2px solid var(--accent)}
.set{background:#fff;border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:var(--sh)}
.set h3{margin:0 0 4px;font-size:17px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px}
.set select,.set input[type=range]{font:inherit;min-height:42px;max-width:58%}
.set input[type=checkbox]{width:26px;height:26px}
.set details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
table.leg{width:100%;border-collapse:collapse;font-size:16px}
table.leg td{padding:6px 4px;border-bottom:1px solid #eee}
table.leg td.ar{font-size:23px;text-align:center;width:44px}
table.leg td:nth-child(2){font-weight:800;width:42px;text-align:center}
.status{font-size:15px;color:var(--muted);margin:4px 0}
.seg{display:flex;background:#EFE8DA;border-radius:99px;padding:4px;gap:4px;margin:8px 0}
.seg button{flex:1;border:0;background:none;border-radius:99px;min-height:42px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg .on{background:#fff;color:var(--olive);box-shadow:var(--sh)}
.ugrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ugrid button{background:#fff;border:0;border-radius:14px;min-height:50px;font:inherit;font-size:16px;cursor:pointer;box-shadow:var(--sh);color:inherit;padding:6px}
.fc{perspective:1200px;margin:6px 0 10px}
.fc-in{position:relative;height:300px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border-radius:24px;box-shadow:0 4px 14px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.face.back{transform:rotateY(180deg);background:#F5FAF6}
.face .lbl{position:absolute;top:12px;font-size:13px;color:var(--muted);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn{margin:0}
.donebox{text-align:center;padding:14px 0 4px}
.donebox .e{font-size:68px}
.celebrate{text-align:center;background:linear-gradient(160deg,#FFF6E8,#FFE2BD);border-radius:18px;padding:12px;margin:8px 0;font-size:20px;font-weight:800}
.plan{margin:4px 0 0;padding-inline-start:22px}.plan li{margin:3px 0}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<nav id="nav" aria-label="ניווט ראשי">

const TTS='speechSynthesis' in window;
const IN_FRAME=(()=>{try{return window.top!==window.self}catch(e){return true}})();
const CAN_ONLINE=/^https?:$/.test(location.protocol)&&!IN_FRAME;
let voices=[],voicesReady=false,audioEl=null,warned=false;
function loadVoices(){if(!TTS)return;const v=speechSynthesis.getVoices();voicesReady=v.length>0;voices=v.filter(x=>/^ar/i.test(x.lang))}
if(TTS){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(cur==='settings'&&!L)renderSettings()}}
function arVoice(){return voices.find(v=>v.name===S.settings.voice)||voices.find(v=>/ar[-_](IL|PS|JO|LB|SY)/i.test(v.lang))||voices.find(v=>/google/i.test(v.name))||voices[0]}
const cleanTxt=t=>t.replace(/\(.*?\)/g,'').replace(/\.\.\./g,' ').trim();
function useOnline(){const m=S.settings.src;if(m==='device')return false;if(m==='online')return CAN_ONLINE;return CAN_ONLINE&&!arVoice()}
function noVoice(){if(warned)return;warned=true;toast('🔇 לא הצלחתי להשמיע. אפשר לסדר את הקול בהגדרות ⚙️',3800)}
function stopAudio(){try{audioEl&&audioEl.pause()}catch(e){}audioEl=null;try{TTS&&speechSynthesis.cancel()}catch(e){}}
function speak(text,opt={}){
  let fired=false;const fin=()=>{if(fired)return;fired=true;opt.onend&&opt.onend()};
  const t=cleanTxt(text);stopAudio();
  if(useOnline()){
    const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&q='+encodeURIComponent(t));
    a.playbackRate=opt.slow?0.7:Math.min(1,S.settings.rate+0.1);audioEl=a;
    const fail=()=>{if(audioEl!==a)return;audioEl=null;if(TTS&&S.settings.src!=='online')deviceSpeak(t,opt.slow,fin);else{noVoice();fin()}};
    a.onended=fin;a.onerror=fail;a.play().catch(fail);
    if(opt.onend)setTimeout(fin,4000+t.length*300);
    return;
  }
  deviceSpeak(t,opt.slow,fin);
  if(opt.onend)setTimeout(fin,2500+t.length*260);
}
function deviceSpeak(t,slow,fin){
  if(!TTS){noVoice();setTimeout(fin,300);return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t),v=arVoice();
  if(v){u.voice=v;u.lang=v.lang}else u.lang='ar-SA';
  u.rate=slow?0.55:S.settings.rate;u.onend=fin;u.onerror=()=>{if(!v)noVoice();fin()};
  setTimeout(()=>speechSynthesis.speak(u),60);
}

/* ================= זיהוי דיבור ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micBlocked=false;const canMic=()=>!!SR&&!micBlocked;
const BLOCK=['not-allowed','service-not-allowed','start','audio-capture'];
function norm(s){return s.replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^ء-ي ]/g,'').replace(/\s+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const sim=(a,b)=>(!a||!b)?0:1-lev(a,b)/Math.max(a.length,b.length);
let rec=null;
function listen(target,cb){
  let done=false;const fin=r=>{if(done)return;done=true;cb(r)};
  try{rec&&rec.abort()}catch(e){}stopAudio();
  rec=new SR();rec.lang=S.settings.mic;rec.maxAlternatives=5;rec.interimResults=false;
  rec.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript),t=norm(cleanTxt(target));
    const best=Math.max(...alts.map(a=>{const n=norm(a);return(n.includes(t)&&t.length>1)?1:sim(n,t)}));fin({ok:best>=0.6,heard:alts[0]})};
  rec.onerror=e=>fin({error:e.error});rec.onend=()=>fin({error:'no-speech'});
  try{rec.start()}catch(e){fin({error:'start'})}
}
function micMsg(r){
  if(r.error==='no-speech')return '🤫 לא שמעתי, נסה שוב';
  if(r.error)return '⚠️ זיהוי הדיבור לא זמין כרגע';
  return r.ok?`✅ מעולה! שמעתי: <span class="ar" lang="ar">${esc(r.heard)}</span>`:`🔁 כמעט! שמעתי: <span class="ar" lang="ar">${esc(r.heard||'…')}</span>`;
}

function startTest(){stopAll();L=null;document.body.classList.add('inlesson');T={step:'self',lv:0,qs:[],pos:0,score:[0,0,0,0],wrong:[],n:0};renderTest()}
function levelQs(li){
  const seen=new Set(),pool=shuffle(LEVELS[li].units.flatMap(u=>UNITS[u].list)).filter(it=>{if(seen.has(it.tr))return false;seen.add(it.tr);return true}).slice(0,3);
  const types=shuffle(['listen','m2t','listen']);
  return pool.map((it,k)=>{const t=types[k],f=t==='listen'?'he':'tr';return{t,it,f,lv:li,opts:opts(it,f)}});
}
function lbar(pct,exit){return `<div class="lbar"><button class="x" onclick="${exit}" aria-label="יציאה">✕</button><div class="prog"><i style="width:${pct}%"></i></div></div>`}
function renderTest(){
  const top=lbar(T.step==='q'?Math.round(T.n/12*100):0,"go('home')");
  if(T.step==='self'){app.innerHTML=top+`<h2 style="text-align:center">📝 מבחן רמה</h2><p class="q">כמה ערבית אתה יודע היום?</p><div class="opts">
    ${['🌱 בכלל לא, מתחיל מאפס','🙂 כמה מילים מהסלנג','🌳 מסתדר במשפטים פשוטים','🫒 מנהל שיחות קצרות'].map((t,i)=>`<button class="opt" onclick="T.self=${i};testGo()">${t}</button>`).join('')}</div>`;return}
  const q=T.qs[T.pos];
  app.innerHTML=top+(q.t==='listen'?`<p class="q">מה שמעת?</p><div class="center"><button class="bigplay" onclick="play('${q.it.id}')" aria-label="השמע שוב">🔊</button></div>`
     :`<p class="q">איך אומרים בערבית?</p><div class="prompt">${esc(q.it.he)}</div>`)+
   `<div class="opts">${q.opts.map((o,i)=>`<button class="opt" id="o${i}" onclick="testAns(${i})">${esc(o[q.f])}</button>`).join('')}
    <button class="opt idk" id="oidk" onclick="testAns(-1)">🤷 לא יודע</button></div>`;
  if(q.t==='listen')setTimeout(()=>play(q.it.id),300);
}
function testGo(){if(T.self===0){finishTest(0);return}T.step='q';T.qs=levelQs(0);T.pos=0;renderTest()}
function testAns(i){
  const q=T.qs[T.pos];if(q.done)return;q.done=true;
  const ok=i>=0&&q.opts[i].id===q.it.id;(i>=0?$('#o'+i):$('#oidk')).classList.add('picked');
  if(ok)T.score[q.lv]++;else T.wrong.push(q.it.id);T.n++;
  setTimeout(()=>{if(!T)return;T.pos++;
    if(T.pos<T.qs.length){renderTest();return}
    if(T.score[T.lv]>=2&&T.lv<3){T.lv++;T.qs=levelQs(T.lv);T.pos=0;renderTest();return}
    finishTest(T.score[T.lv]>=2?T.lv+1:T.lv)},420);
}
function finishTest(passed){
  S.level=Math.min(passed,3);S.skip={};
  for(let li=0;li<passed;li++)LEVELS[li].units.forEach(ui=>{const u=UNITS[ui];if(!S.done[u.id])S.skip[u.id]=true;
    u.list.forEach(it=>{if(!S.srs[it.id])S.srs[it.id]={box:2,due:addDays(2)}})});
  T.wrong.forEach(id=>{if(S.srs[id])S.srs[id]={box:1,due:today()}});
  const isNew=markDay(),lv=LEVELS[S.level],todo=UNITS.filter(u=>!S.done[u.id]&&!S.skip[u.id]);
  app.innerHTML=`<div class="donebox"><div class="e">${lv.emoji}</div><h2>הרמה שלך: ${lv.name}</h2><p class="hint">${lv.desc}</p></div>
  ${isNew?`<div class="celebrate">🔥 +1 יום תרגול</div>`:''}
  <div class="set"><h3>📅 התוכנית שלך</h3>${passed?`<p class="status">✓ דילגנו על ${Object.keys(S.skip).length} יחידות שאתה כבר מכיר. המילים שלהן יחזרו בחזרה היומית.</p>`:''}
   ${todo.length?`<ol class="plan">${todo.slice(0,5).map(u=>`<li>${u.emoji} ${esc(u.title)}</li>`).join('')}${todo.length>5?`<li>ועוד ${todo.length-5}…</li>`:''}</ol>`:'<p class="status">אתה מכיר את כל החומר! עכשיו סיפורים וחזרה.</p>'}</div>

  T=null;window.scrollTo(0,0);

/* ================= מנוע שיעור ================= */
function startLesson(ui){
  stopAll();const u=UNITS[ui],q=[{t:'tip',ui}];
  for(let c=0;c<u.list.length;c+=4){
    const ch=u.list.slice(c,c+4);
    ch.forEach(it=>q.push({t:'learn',it}));
    if(ch.length>=3)q.push({t:'match',its:ch});
    const pr=ch.map(it=>({t:pick(['listen','m2t','t2m']),it}));
    shuffle(ch).slice(0,ch.length>=3?2:1).forEach(it=>pr.push({t:'speak',it}));
    q.push(...shuffle(pr));
  }
  if(u.dlg.length)q.push({t:'dialog',ui});
  q.push({t:'done'});
  L={mode:'lesson',ui,q,pos:0,res:{}};
  document.body.classList.add('inlesson');renderStep();
}
function startReview(){
  const ids=shuffle(dueIds()).slice(0,15);if(!ids.length){go('home');return}
  const q=ids.map(id=>({t:Math.random()<.22?'speak':pick(['listen','m2t','t2m']),it:BYID[id]}));q.push({t:'done'});
  L={mode:'review',q,pos:0,res:{}};document.body.classList.add('inlesson');renderStep();
}
function next(){$('.fb')&&$('.fb').remove();stopAll();L.pos++;renderStep()}
function record(id,ok){if(!(id in L.res))L.res[id]=ok}
function requeue(s){if(s.retry)return;let k=L.q.findIndex((x,j)=>j>L.pos&&(x.t==='dialog'||x.t==='done'));if(k<0)k=L.q.length;L.q.splice(k,0,{t:s.t,it:s.it,retry:true})}
function renderStep(){
  const s=L.q[L.pos];L.after=null;
  app.innerHTML=lbar(Math.round(L.pos/Math.max(1,L.q.length-1)*100),"go('home')")+STEP[s.t](s);
  window.scrollTo(0,0);if(L.after)setTimeout(L.after,320);
}
function opts(it,field){
  const seen=new Set([it[field]]),seenTr=new Set([it.tr]),out=[it];
  for(const o of shuffle(UNITS[it.unit].list).concat(shuffle(ALL))){if(out.length>=4)break;if(!seen.has(o[field])&&!seenTr.has(o.tr)){seen.add(o[field]);seenTr.add(o.tr);out.push(o)}}
  return shuffle(out);
}
const optsHtml=(s,f)=>`<div class="opts">${s.opts.map((o,i)=>`<button class="opt" id="o${i}" onclick="choose(${i})">${esc(o[f])}${f==='tr'&&S.settings.script?`<small class="ar" lang="ar">${esc(o.ar)}</small>`:''}</button>`).join('')}</div>`;
const playRow=id=>`<div class="row"><button class="pill" onclick="play('${id}')">🔊 השמע</button><button class="pill" onclick="play('${id}',1)">🐢 לאט</button></div>`;
const STEP={
tip(s){const u=UNITS[s.ui];return `<div class="card"><div style="font-size:50px">${u.emoji}</div><h2>${esc(u.title)}</h2><div class="tip"><b>💡 הסוד</b><p>${esc(u.tip)}</p></div></div><button class="btn primary" onclick="next()">יאללה, מתחילים ←</button>`},
learn(s){const it=s.it;L.after=()=>play(it.id);
  return `<div class="card"><span class="tag">${it.big?'צליל חדש':'מילה חדשה'}</span>
  ${it.big?`<div class="big ar" lang="ar">${esc(it.big)}</div>`:''}<div class="tr">${esc(it.tr)}</div>${arHtml(it.ar)}<div class="he">${esc(it.he)}</div>
  ${it.note?`<div class="note">💡 ${esc(it.note)}</div>`:''}${playRow(it.id)}
  ${canMic()?`<div class="row"><button class="pill" id="lmic" onclick="learnMic('${it.id}')">🎙 נסה לומר</button></div><div class="res" id="micres"></div>`:''}
  </div><button class="btn primary" onclick="next()">הבנתי, הלאה ←</button>`},
listen(s){s.field='he';s.opts=s.opts||opts(s.it,'he');L.after=()=>play(s.it.id);
  return `<p class="q">מה שמעת?</p><div class="center"><button class="bigplay" onclick="play('${s.it.id}')" aria-label="השמע שוב">🔊</button><button class="pill" onclick="play('${s.it.id}',1)">🐢 לאט</button></div>${optsHtml(s,'he')}`},
m2t(s){s.field='tr';s.opts=s.opts||opts(s.it,'tr');
  return `<p class="q">איך אומרים בערבית?</p><div class="prompt">${esc(s.it.he)}</div>${optsHtml(s,'tr')}`},
t2m(s){s.field='he';s.opts=s.opts||opts(s.it,'he');L.after=()=>play(s.it.id);
  return `<p class="q">מה זה אומר?</p><div class="card" style="padding:12px"><div class="tr">${esc(s.it.tr)}</div>${arHtml(s.it.ar)}<div class="row" style="margin-top:6px"><button class="pill" onclick="play('${s.it.id}')">🔊 השמע</button></div></div>${optsHtml(s,'he')}`},
speak(s){const it=s.it;s.tries=0;
  return `<p class="q">עכשיו אתה! אמור בערבית:</p><div class="card"><div class="he" style="font-weight:800">${esc(it.he)}</div><div class="tr">${esc(it.tr)}</div>${arHtml(it.ar)}${playRow(it.id)}</div>
  ${canMic()?`<div class="center" style="margin-top:14px"><button class="mic" id="micbtn" onclick="speakTry()" aria-label="לחץ ודבר">🎙</button><p class="hint" id="michint">לחץ ודבר</p></div><div class="res" id="micres"></div><button class="btn ghost" onclick="next()">דלג</button>`
   :`<p class="hint" style="margin-top:12px">שמע, אמור בקול 2–3 פעמים, וסמן:</p><button class="btn primary" onclick="record('${it.id}',true);next()">✓ אמרתי בקול!</button><button class="btn ghost" onclick="next()">דלג</button>`}`},
match(s){s.left=s.its.length;s.sel={};const a=shuffle(s.its),b=shuffle(s.its);
  return `<p class="q">התאם זוגות</p><div class="match"><div class="col">${a.map(it=>`<button class="mt" id="mtr-${it.id}" onclick="tapMatch('tr','${it.id}')">${esc(it.tr)}</button>`).join('')}</div>
  <div class="col">${b.map(it=>`<button class="mt" id="mhe-${it.id}" onclick="tapMatch('he','${it.id}')">${esc(it.he)}</button>`).join('')}</div></div>`},
dialog(s){const u=UNITS[s.ui];return `<p class="q">💬 שיחה. נסה להבין לפני שאתה מציץ ב-👁</p>${linesHtml(u.dlg,u.names)}<button class="btn primary" onclick="next()">סיימתי ←</button>`},
done(s){if(!s.applied){s.applied=true;L.isNew=finishSession()}
  const r=Object.values(L.res),ok=r.filter(Boolean).length,u=L.mode==='lesson'?UNITS[L.ui]:null,nx=nextUnit();
  return `<div class="donebox"><div class="e">🎉</div><h2>${u?'סיימת את "'+esc(u.title)+'"!':'החזרה הושלמה!'}</h2>${r.length?`<p class="hint">${ok} מתוך ${r.length} נכון בניסיון הראשון</p>`:''}</div>
  ${L.isNew?`<div class="celebrate">🔥 +1 יום תרגול · סה״כ ${S.days.length}</div>`:''}
  ${u&&nx>=0?`<button class="btn primary" onclick="startLesson(${nx})">הבא: ${UNITS[nx].emoji} ${esc(UNITS[nx].title)} ←</button>`:''}
  <button class="btn secondary" onclick="go('home')">לדף הבית</button>`}
};
function choose(i){
  const s=L.q[L.pos];if(s.answered)return;s.answered=true;
  const o=s.opts[i],ok=o.id===s.it.id||o[s.field]===s.it[s.field];
  s.opts.forEach((x,k)=>{const b=$('#o'+k);b.disabled=true;if(x.id===s.it.id)b.classList.add('good')});
  if(!ok){$('#o'+i).classList.add('badx');vib(120);requeue(s)}
  record(s.it.id,ok);play(s.it.id);feedback(ok,s.it);
}
function feedback(ok,it,title){
  const d=document.createElement('div');d.className='fb '+(ok?'ok':'bad');d.setAttribute('role','status');
  d.innerHTML=`<div class="in"><h3>${title||(ok?pick(['✓ נכון!','✓ מעולה!','✓ אחלא!','✓ ממתאז!']):'✗ לא נורא, זה יחזור')}</h3>
  ${it?`<p><b>${esc(it.tr)}</b> = ${esc(it.he)}</p>`:''}<button class="btn ${ok?'primary':'accent'}" onclick="next()">המשך ←</button></div>`;
  document.body.appendChild(d);d.querySelector('button').focus({preventScroll:true});
}
function tapMatch(side,id){
  const s=L.q[L.pos],el=$(`#m${side}-${id}`);
  document.querySelectorAll(`[id^="m${side}-"]`).forEach(b=>b.classList.remove('sel'));
  s.sel[side]=id;el.classList.add('sel');if(side==='tr')play(id);
  if(s.sel.tr&&s.sel.he){const a=$(`#mtr-${s.sel.tr}`),b=$(`#mhe-${s.sel.he}`);
    if(s.sel.tr===s.sel.he){a.className='mt done';b.className='mt done';if(!--s.left)setTimeout(()=>feedback(true,null,'✓ כל הזוגות נכונים!'),350)}
    else{[a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('wrong');setTimeout(()=>x.classList.remove('wrong'),400)});vib(80)}
    s.sel={}}
}
function learnMic(id){const btn=$('#lmic'),res=$('#micres');btn.textContent='👂 מקשיב...';
  listen(BYID[id].ar,r=>{if(BLOCK.includes(r.error)){micBlocked=true;btn.remove();res.innerHTML='אמור את המילה בקול 2–3 פעמים 🙂';return}btn.textContent='🎙 נסה לומר';res.innerHTML=micMsg(r)})}
function speakTry(){
  const s=L.q[L.pos],btn=$('#micbtn'),res=$('#micres'),hint=$('#michint');if(s.answered)return;
  btn.classList.add('on');hint.textContent='👂 מקשיב... דבר עכשיו';res.innerHTML='';
  listen(s.it.ar,r=>{
    if(BLOCK.includes(r.error)){micBlocked=true;renderStep();return}
    btn.classList.remove('on');hint.textContent='לחץ ודבר';res.innerHTML=micMsg(r);
    if(r.ok){s.answered=true;record(s.it.id,true);feedback(true,s.it)}
    else if(++s.tries>=2&&!$('.fb'))feedback(true,s.it,'👍 ממשיכים, זה יגיע');
  });
}

/* ================= שורות: דיאלוג וסיפור ================= */
let CUR=[],showHe=false,seqTok=0;
function linesHtml(lines,names){
  CUR=lines;showHe=false;
  return `<div class="ctl"><button class="pill" onclick="playSeq(false)">▶ השמע הכל</button><button class="pill" onclick="playSeq(true)">🗣 מצב צל</button><button class="pill" onclick="toggleAllHe()">👁 תרגום</button><button class="pill" onclick="stopAll()">⏹</button></div>
  <div class="lines">${lines.map((l,i)=>`<div class="bub ${l.who==='A'?'a':l.who==='B'?'b':'n'}" id="bub${i}" role="button" tabindex="0" onclick="playLine(${i})">
   ${names&&names[l.who]?`<div class="who">${esc(names[l.who])}</div>`:''}<div class="btr">${esc(l.tr)}</div>${arHtml(l.ar,'bar')}
   <div class="bhe hid" id="he${i}">${esc(l.he)}</div><button class="eye" onclick="event.stopPropagation();toggleHe(${i})" aria-label="תרגום">👁</button></div>`).join('')}</div>`;
}
function openDialog(ui){stopAll();const u=UNITS[ui];app.innerHTML=`<button class="back" onclick="openUnit(${ui})">→ חזרה</button><h2>💬 ${esc(u.title)}</h2><p class="hint">🗣 מצב צל: שומעים שורה וחוזרים אחריה בקול</p>${linesHtml(u.dlg,u.names)}`;window.scrollTo(0,0)}
function hl(i){document.querySelectorAll('.bub').forEach(b=>b.classList.remove('playing'));const b=i>=0&&$('#bub'+i);if(b){b.classList.add('playing');b.scrollIntoView({block:'center',behavior:'smooth'})}}
function playLine(i){seqTok++;hl(i);speak(CUR[i].ar,{onend:()=>hl(-1)})}
function toggleHe(i){$('#he'+i).classList.toggle('hid')}
function toggleAllHe(){showHe=!showHe;document.querySelectorAll('.bhe').forEach(e=>e.classList.toggle('hid',!showHe))}
function playSeq(shadow){const tok=++seqTok,d=CUR;let k=0;
  const step=()=>{if(tok!==seqTok)return;if(k>=d.length){hl(-1);return}const i=k++;hl(i);
    speak(d[i].ar,{onend:()=>{if(tok===seqTok)setTimeout(step,shadow?Math.max(1800,d[i].tr.length*170):450)}})};step()}
function stopAll(){seqTok++;stopAudio();try{rec&&rec.abort()}catch(e){}}

/* ================= סיום וחזרה מרווחת ================= */
function finishSession(){
  if(L.mode==='lesson'){const u=UNITS[L.ui];S.done[u.id]=true;delete S.skip[u.id];
    u.list.forEach(it=>{if(!S.srs[it.id]||L.res[it.id]===false)S.srs[it.id]={box:1,due:addDays(1)}})}
  else for(const id in L.res)if(S.srs[id])srsUpdate(id,L.res[id]);
  return markDay();
}

/* ================= כרטיסיות ================= */
let FC=null;
function renderCards(){
  const learned=Object.keys(S.srs).filter(id=>BYID[id]),due=dueIds();
  app.innerHTML=topbar()+`<h2>🃏 כרטיסיות</h2><p class="hint" style="text-align:right">רואים צד אחד, נזכרים, הופכים ומסמנים אם ידעת.</p>
  <div class="seg"><button class="${S.fcDir==='he'?'on':''}" onclick="setDir('he')">עברית ← ערבית</button><button class="${S.fcDir==='ar'?'on':''}" onclick="setDir('ar')">ערבית ← עברית</button></div>
  ${due.length?`<button class="btn accent" onclick="startCards('due')">🔁 מילים לחזרה היום · ${due.length}</button>`:''}
  ${learned.length?`<button class="btn primary" onclick="startCards('all')">🎲 ערבוב מכל מה שלמדת · ${learned.length}</button>`:''}
  <p class="q" style="margin-top:12px">או לפי נושא:</p>
  <div class="ugrid">${UNITS.map((u,i)=>`<button onclick="startCards('u',${i})">${u.emoji} ${esc(u.title)}</button>`).join('')}</div>`;
}
function setDir(d){S.fcDir=d;save();renderCards()}
function startCards(kind,ui){
  let ids=kind==='due'?dueIds():kind==='all'?Object.keys(S.srs).filter(id=>BYID[id]):UNITS[ui].list.map(it=>it.id);
  ids=shuffle(ids).slice(0,20);if(!ids.length)return;
  stopAll();FC={ids,pos:0,flip:false,know:0,back:kind==='u'&&cur!=='cards'?ui:null};document.body.classList.add('inlesson');renderCard();
}
function renderCard(){
  if(FC.pos>=FC.ids.length){const isNew=markDay();
    app.innerHTML=`<div class="donebox"><div class="e">🃏</div><h2>סיימת ${FC.ids.length} כרטיסים!</h2><p class="hint">ידעת ${FC.know} מתוך ${FC.ids.length}</p></div>
    ${isNew?`<div class="celebrate">🔥 +1 יום תרגול · סה״כ ${S.days.length}</div>`:''}
    <button class="btn primary" onclick="go('cards')">לעוד כרטיסיות</button><button class="btn secondary" onclick="go('home')">לדף הבית</button>`;return}
  const it=BYID[FC.ids[FC.pos]],he=S.fcDir==='he';
  const word=`<div class="tr">${esc(it.tr)}</div>${arHtml(it.ar)}`,mean=`<div class="prompt" style="margin:0">${esc(it.he)}</div>`;
  app.innerHTML=lbar(Math.round(FC.pos/FC.ids.length*100),"go(cur)")+`
  <div class="fc ${FC.flip?'flip':''}" id="fc"><div class="fc-in" onclick="flipCard()" role="button" aria-label="הפוך כרטיס">
    <div class="face"><span class="lbl">${he?'איך אומרים בערבית?':'מה זה אומר?'}</span>${he?mean:word}<p class="hint" style="margin-top:14px">הקש כדי להפוך 🔄</p></div>
    <div class="face back"><span class="lbl">התשובה</span>${he?word:mean}${it.note?`<div class="note">💡 ${esc(it.note)}</div>`:''}</div>
  </div></div>
  <div class="row" style="margin:0 0 10px"><button class="pill" onclick="play('${it.id}')">🔊 השמע</button><button class="pill" onclick="play('${it.id}',1)">🐢 לאט</button></div>
  ${FC.flip?`<div class="two"><button class="btn secondary" onclick="cardAns(false)">😕 עוד לא</button><button class="btn primary" onclick="cardAns(true)">😊 ידעתי</button></div>`
   :`<button class="btn secondary" onclick="flipCard()">🔄 הפוך</button>`}`;
  if(!he&&!FC.flip)setTimeout(()=>play(it.id),300);
}
function flipCard(){if(FC.flip)return;FC.flip=true;renderCard();if(S.fcDir==='he')play(FC.ids[FC.pos])}
function cardAns(ok){const id=FC.ids[FC.pos];if(ok)FC.know++;
  if(S.srs[id])srsUpdate(id,ok);else S.srs[id]={box:ok?2:1,due:addDays(ok?3:1)};save();
  FC.pos++;FC.flip=false;stopAll();renderCard()}

/* ================= סיפורים ================= */
function renderStories(){
  const lv=S.level??0;
  app.innerHTML=topbar()+`<h2>📖 סיפורים</h2><p class="hint" style="text-align:right">סיפורים קצרים מהחיים. הקש על שורה כדי לשמוע, ועל 👁 לתרגום.</p>
  ${STORIES.map((s,i)=>`<button class="wrow ${!S.stories[s.id]&&s.lv===lv?'rec':''}" onclick="openStory(${i})"><span style="font-size:28px">${s.emoji}</span>
    <div class="w"><b>${esc(s.title)}</b><small>${s.ln.length} שורות · 2 שאלות</small></div>
    ${S.stories[s.id]?'<span class="lt" style="background:var(--okbg);color:var(--ok)">✓ נקרא</span>':`<span class="lt">${LEVELS[s.lv].emoji} רמה ${s.lv+1}</span>`}</button>`).join('')}`;
}
let SQ=null;
function openStory(i){
  stopAll();const s=STORIES[i];SQ={i,ans:{}};
  app.innerHTML=`<button class="back" onclick="go('stories')">→ לכל הסיפורים</button><h2>${s.emoji} ${esc(s.title)}</h2>${linesHtml(s.ln)}
  <div class="set"><h3>❓ הבנת?</h3>${s.qs.map((q,k)=>`<p style="margin:8px 0 4px;font-weight:700">${esc(q[0])}</p>
    <div class="opts" style="margin:0">${q[1].split('|').map((o,j)=>`<button class="opt" style="min-height:48px;font-size:18px" id="sq${k}_${j}" onclick="storyAns(${k},${j})">${esc(o)}</button>`).join('')}</div>`).join('')}
  <div id="sqend"></div></div>`;
  window.scrollTo(0,0);
}
function storyAns(k,j){
  const s=STORIES[SQ.i],q=s.qs[k];if(k in SQ.ans)return;SQ.ans[k]=j===q[2];
  q[1].split('|').forEach((_,x)=>{const b=$(`#sq${k}_${x}`);b.disabled=true;if(x===q[2])b.classList.add('good');else if(x===j)b.classList.add('badx')});
  if(Object.keys(SQ.ans).length===s.qs.length){S.stories[s.id]=true;const isNew=markDay(),ok=Object.values(SQ.ans).filter(Boolean).length;
    $('#sqend').innerHTML=`<div class="celebrate">${ok===s.qs.length?'🎉 הבנת הכל!':'👍 יפה! קרא שוב ותבין עוד יותר'}${isNew?'<br>🔥 +1 יום תרגול':''}</div>
    <button class="btn primary" onclick="go('stories')">לסיפור הבא ←</button>`}
}

/* ================= מילון ================= */
function renderDict(ui){
  const unitMode=typeof ui==='number';
  app.innerHTML=(unitMode?`<button class="back" onclick="openUnit(${ui})">→ חזרה</button><h2>📋 ${esc(UNITS[ui].title)}</h2>`
   :topbar()+`<input class="search" id="q" type="search" placeholder="🔍 חיפוש בעברית או בתעתיק…" oninput="dictList()" aria-label="חיפוש">`)+`<div id="dl"></div>`;
  dictList(unitMode?ui:undefined);
}
function dictList(ui){
  const q=($('#q')&&$('#q').value||'').trim(),seen=new Set();
  const src=(typeof ui==='number'?UNITS[ui].list:ALL).filter(it=>{const k=it.ar+'|'+it.he;if(seen.has(k))return false;seen.add(k);return !q||it.he.includes(q)||it.tr.includes(q)||norm(it.ar).includes(norm(q))});
  $('#dl').innerHTML=src.length?src.map(it=>`<button class="wrow" onclick="play('${it.id}')"><span aria-hidden="true">🔊</span><div class="w"><b>${esc(it.tr)}</b>${S.settings.script?`<span class="ar" lang="ar">${esc(it.ar)}</span>`:''}<small>${esc(it.he)}</small></div>${S.srs[it.id]?'<span class="lt" style="background:var(--okbg);color:var(--ok)">✓</span>':''}</button>`).join(''):`<p class="hint">לא נמצא</p>`;
}

/* ================= הגדרות ================= */
let resetArmed=false;
function voiceStatus(){
  const v=arVoice();
  if(v)return `✓ קול ערבי במכשיר: ${esc(v.name)}`;
  if(CAN_ONLINE)return '🌐 אין קול ערבי במכשיר, אז משתמשים בקול אונליין (צריך אינטרנט).';
  return '⚠️ אין קול ערבי במכשיר. באנדרואיד: הגדרות ← המרת טקסט לדיבור ← Google ← התקנת נתוני קול ← ערבית. באייפון: הגדרות ← נגישות ← תוכן מוקרא ← קולות ← ערבית.';
}
function renderSettings(){
  const st=S.settings;
  app.innerHTML=`<button class="back" onclick="go('home')">→ חזרה</button><h2>⚙️ הגדרות</h2>
  <div class="set"><h3>🔊 קול</h3><p class="status">${voiceStatus()}</p>
   <label><span>מקור הקול</span><select onchange="setS('src',this.value)">${[['auto','אוטומטי'],['device','קול המכשיר'],['online','קול אונליין']].map(([v,n])=>`<option value="${v}" ${v===st.src?'selected':''}>${n}</option>`).join('')}</select></label>
   ${voices.length>1?`<label><span>קול במכשיר</span><select onchange="setS('voice',this.value)"><option value="">אוטומטי</option>${voices.map(v=>`<option ${v.name===st.voice?'selected':''} value="${esc(v.name)}">${esc(v.name)}</option>`).join('')}</select></label>`:''}
   <label><span>מהירות</span><input type="range" min="0.5" max="1.1" step="0.05" value="${st.rate}" onchange="setS('rate',+this.value)"></label>
   <button class="btn secondary" onclick="warned=false;speak('مرحبا، كيفك؟')">🔊 בדיקת קול</button></div>
  <div class="set"><h3>👀 תצוגה</h3><label><span>להציג כתב ערבי</span><input type="checkbox" ${st.script?'checked':''} onchange="setS('script',this.checked)"></label></div>
  <div class="set"><h3>📝 רמה</h3><label><span>הרמה שלך</span><b>${S.level===null?'עוד לא נבדקה':LEVELS[S.level].emoji+' '+LEVELS[S.level].name}</b></label>
   <button class="btn secondary" onclick="startTest()">${S.level===null?'למבחן רמה':'מבחן רמה מחדש'}</button></div>
  ${SR?`<div class="set"><h3>🎙 זיהוי דיבור</h3><label><span>ניב</span><select onchange="setS('mic',this.value)">${[['ar-IL','ישראל'],['ar-PS','פלסטינית'],['ar-JO','ירדן']].map(([v,n])=>`<option value="${v}" ${v===st.mic?'selected':''}>${n}</option>`).join('')}</select></label></div>`:''}
  <div class="set"><details><summary>🔤 מקרא תעתיק</summary><table class="leg">
   ${[['ح','ח','ח עמוקה מהגרון'],['خ','ח\'','ח/כ רגילה'],['ع','ע','ע גרונית'],['غ','ע\'','כמו ר גרונית'],['ج','ג\'','כמו ג\'ירפה'],['ق','ק','k (במשולש)'],['ص','צ','S כבדה, לא ts'],['ض','צ\'','D כבדה'],['ط','ט','T כבדה'],['ث','ת','במדוברת: ת'],['ذ','ד','במדוברת: ד'],['ك','כּ','k בסוף מילה']].map(r=>`<tr><td class="ar" lang="ar">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
  </table></details></div>
  <button class="btn ghost" id="rst" onclick="resetAll()">איפוס כל ההתקדמות</button>`;
  window.scrollTo(0,0);
}
function setS(k,v){S.settings[k]=v;save();if(k!=='rate')renderSettings()}
function resetAll(){if(!resetArmed){resetArmed=true;$('#rst').textContent='בטוח? לחץ שוב לאיפוס';setTimeout(()=>resetArmed=false,4000);return}
  S={done:{},srs:{},days:[],level:null,skip:{},stories:{},fcDir:'he',settings:S.settings};save();resetArmed=false;go('home')}

go('home');
</script>
</body>
</html>
